# Script-level config: applies whenever demo/app.py is run, from any folder.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F8"
textColor = "#1F2937"
borderColor = "#E5E7EB"
baseRadius = "0.6rem"
metricValueFontSize = "1.45rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
